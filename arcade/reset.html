<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex,nofollow">
  <title>Obnova hesla – FOXEY Arcade</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .reset-shell{max-width:550px;margin:48px auto;padding:0 18px}
    .reset-panel{background:#151e34;border:1px solid #2e3958;border-radius:20px;padding:26px;display:grid;gap:14px}
    .reset-panel h1{font-size:25px;margin:0}
    .reset-panel p{color:#c5d0e6;line-height:1.6;margin:0}
    .reset-panel form{display:grid;gap:12px}
    .reset-panel label{font-weight:650}
    .reset-panel input{width:100%}
    .reset-panel .hidden{display:none!important}
    #resetStatus{min-height:36px}
    .reset-brand{display:block;text-decoration:none;color:#f4f6ff;font-size:20px;font-weight:800;margin:0 0 24px}
    .reset-brand span{color:#ad8aff}
  </style>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <main class="reset-shell">
    <a class="reset-brand" href="./#account">🦊 FOXEY <span>ARCADE</span></a>
    <section class="reset-panel" aria-labelledby="resetTitle">
      <h1 id="resetTitle">🔐 Nastavit nové heslo</h1>
      <p id="resetStatus" role="status" aria-live="polite">Ověřuji obnovovací odkaz…</p>
      <form id="resetForm" class="hidden">
        <label for="resetNewPassword">Nové heslo</label>
        <input type="password" id="resetNewPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
        <label for="resetConfirmPassword">Potvrdit nové heslo</label>
        <input type="password" id="resetConfirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button class="primary full" type="submit" id="resetSubmit">✓ Uložit nové heslo</button>
      </form>
      <a class="secondary full" id="resetBack" href="./#account">← Zpět na přihlášení / vyžádat nový odkaz</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="./config.js"></script>
  <script src="./reset.js"></script>
</body>
</html>

name: Verify FOXEY Arcade public preview
on:
  push:
    branches: [main]
    paths:
      - 'arcade/**'
      - 'secure-quiz-beta.html'
      - 'tests/arcade-global-notifications-client.cjs'
      - 'tests/secure-async-history-client.cjs'
      - 'tests/arcade-global-achievements-client.cjs'
      - 'tests/arcade-global-missions-client.cjs'
      - 'tests/arcade-ui-subtabs-client.cjs'
      - 'tests/arcade-ui2-navigation-client.cjs'
      - 'tests/arcade-friends-client.cjs'
      - 'tests/arcade-live-client.cjs'
      - 'tests/arcade-rematch-two-players-client.cjs'
      - 'tests/arcade-series-two-player-client.cjs'
      - '.github/workflows/verify-arcade-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and publishable-assets checks
        run: |
          set -euo pipefail
          node --check arcade/app.js
          node --check arcade/notifications.js
          node --check arcade/friends.js
          node --check arcade/live.js
          node --check arcade/ui2.js
          node --check arcade/missions.js
          node --check arcade/i18n.js
          node --check tests/arcade-global-notifications-client.cjs
          node --check tests/secure-async-history-client.cjs
          node tests/arcade-global-notifications-client.cjs
          node tests/secure-async-history-client.cjs
          node --check tests/arcade-global-achievements-client.cjs
          node tests/arcade-global-achievements-client.cjs
          node --check tests/arcade-global-missions-client.cjs
          node tests/arcade-global-missions-client.cjs
          node --check tests/arcade-ui-subtabs-client.cjs
          node tests/arcade-ui-subtabs-client.cjs
          node --check tests/arcade-ui2-navigation-client.cjs
          node tests/arcade-ui2-navigation-client.cjs
          node --check tests/arcade-friends-client.cjs
          node tests/arcade-friends-client.cjs
          node --check tests/arcade-live-client.cjs
          node tests/arcade-live-client.cjs
          node --check tests/arcade-rematch-two-players-client.cjs
          node tests/arcade-rematch-two-players-client.cjs
          node --check tests/arcade-series-two-player-client.cjs
          node tests/arcade-series-two-player-client.cjs
          node --check arcade/config.js
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('arcade/index.html','utf8');
          const js=fs.readFileSync('arcade/app.js','utf8');
          const config=fs.readFileSync('arcade/config.js','utf8');
          const gameConfig=fs.readFileSync('account-config.js','utf8');
          const avatars=fs.readFileSync('arcade/avatars.js','utf8');
          const gameAuth=fs.readFileSync('account-test.js','utf8');
          for(const id of ['page-home','page-games','page-play','page-community','page-account','page-settings','authForm','nickname','avatar','signOut','gameFrame','headerArcadeXp','headerArcadeLevel','homeArcadeXp','homeArcadeLevel','accountArcadeXp','accountArcadeLevel','homeXp','homeLevel','homeShards','homeCrowns','accountXp','accountLevel','accountShards','accountCrowns'])
            if(!html.includes('id="'+id+'"')) throw Error('Missing UI element '+id);
          if(!html.includes('./styles.css')||!html.includes('./app.js')||!html.includes('./ui2.js')||!html.includes('./missions.js')||!html.includes('./friends.js')||!html.includes('./config.js')||
             !html.includes('./live.js')||!html.includes('./avatars.js')||!avatars.includes('FOXEY_AVATAR_ART'))
            throw Error('Missing relative asset links');
          if(!config.includes('sb_publishable_')||/sb_secret_|ghp_[A-Za-z0-9]{20,}|postgres:\/\//.test(config))
            throw Error('Unexpected key or secret in public config');
          if(!js.includes("from('gtg36_account_progress')")||
             !js.includes(".select('profile,revision')"))
            throw Error('Arcade must read actual game cloud progress');
          if(/from\('gtg36_account_progress'\)[\s\S]{0,120}\.(insert|update|upsert|delete)\(/.test(js))
            throw Error('Arcade must never mutate game saves or currencies');
          if(!js.includes('foxey-arcade:gtg-cloud-synced')||
             !gameAuth.includes('foxey-arcade:gtg-cloud-synced'))
            throw Error('Missing live sync notification integration');
          if(!html.includes('preview-3.6.html'))
            throw Error('No link to stable Guess the Game');
          if(!js.includes("const GAME_URL = '../secure-quiz-beta.html"))
            throw Error('Arcade game must launch the secure quiz');
          if(!js.includes('closeGameOnIdentityChange'))
            throw Error('Arcade must unload the game after identity changes');
          if(!config.includes("sessionKey:'foxey.arcade.auth.v1'")||
             !gameConfig.includes("storageKey:'foxey.arcade.auth.v1'"))
            throw Error('Arcade and embedded Guess the Game must share Auth storage');
          console.log('Arcade preview verified: UI, scripts, public key and game-save isolation.');
          NODE
      - name: Verify published preview
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 15 'https://foxey-cz.github.io/GuessTheGame-Web/arcade/index.html' -o /tmp/arcade.html && \
               grep -q 'id="homeXp"' /tmp/arcade.html && \
               curl -fLsS --max-time 15 'https://foxey-cz.github.io/GuessTheGame-Web/arcade/app.js' -o /tmp/arcade.js && \
               grep -q "foxey-arcade:gtg-cloud-synced" /tmp/arcade.js && \
               curl -fLsS --max-time 15 'https://foxey-cz.github.io/GuessTheGame-Web/account-test.js' -o /tmp/game-auth.js && \
               grep -q "notifyArcadeCloudSync" /tmp/game-auth.js; then
              node --check /tmp/arcade.js
              echo 'Public Arcade preview is online.'
              exit 0
            fi
            sleep 10
          done
          echo 'Public preview not available yet' >&2
          exit 1
